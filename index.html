<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="cnJJOmG__X0wI2h3w6hV0cXm352K4i5idE8Hsgd7wlA" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Government Polytechnic, Kalyandurg | AI College Assistant</title>

    <meta name="description" content="Government Polytechnic, Kalyandurg AI College Information Assistant. Find information about courses, admissions, facilities, hostel, and placements.">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .header {
            background: #1f4e79;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .college-logo {
            width: 90px;
            height: auto;
            object-fit: contain;
            flex-shrink: 0;
        }

        .college-name {
            margin: 0;
            font-size: clamp(12px, 3.5vw, 30px);
            white-space: nowrap;
        }

        .header p {
            margin: 8px 0 0;
            font-size: 16px;
        }

        .container {
            max-width: 700px;
            margin: 20px auto;
            padding: 15px;
        }

        .chat-box {
            background: white;
            border-radius: 15px;
            padding: 15px;
            min-height: 400px;
            max-height: 500px;
            overflow-y: auto;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .welcome {
            background: #e8f1fb;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .message {
            padding: 12px 15px;
            margin: 10px 0;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-line;
            overflow-wrap: anywhere;
        }

        .user {
            background: #d9edf7;
            text-align: right;
        }

        .bot {
            background: #eeeeee;
        }

        .input-area {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        #question {
            flex: 1;
            min-width: 0;
            padding: 14px;
            border: 1px solid #bbb;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        #sendBtn {
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            background: #1f4e79;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #sendBtn:active {
            transform: scale(0.97);
        }

        .examples {
            margin-top: 15px;
        }

        .examples button {
            margin: 4px;
            padding: 8px 12px;
            border: 1px solid #1f4e79;
            border-radius: 20px;
            background: white;
            color: #1f4e79;
            cursor: pointer;
        }

        @media (max-width: 500px) {
            .header {
                padding: 12px 5px;
            }

            .header-content {
                gap: 8px;
            }

            .college-logo {
                width: 45px;
            }

            .college-name {
                font-size: clamp(11px, 3.5vw, 18px);
            }

            .header p {
                font-size: 14px;
            }

            .input-area {
                flex-direction: column;
            }

            #sendBtn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="header-content">

            <img
                src="/college-banner.jpg"
                alt="Government Polytechnic, Kalyandurg logo"
                class="college-logo"
            >

            <div>
                <h1 class="college-name">
                    Government Polytechnic Kalyandurg
                </h1>

                <p>AI College Information Assistant</p>
            </div>

        </div>
    </header>

    <main class="container">

        <div class="chat-box" id="chatBox">

            <div class="welcome">
                <strong>Welcome to GPT.KLD!</strong>
                <p>
                    Ask me anything about Government Polytechnic,
                    Kalyandurg, including courses, admissions,
                    facilities, and college information.
                </p>
            </div>

        </div>

        <form class="input-area" id="chatForm">
            <input
                type="text"
                id="question"
                placeholder="Ask your college question..."
                autocomplete="off"
                required
            >

            <button type="submit" id="sendBtn">Send</button>
        </form>

    </main>

    <script>
        async function sendMessage() {
            const input = document.getElementById("question");
            const message = input.value.trim();

            if (!message) {
                return;
            }

            addMessage(message, "user");
            input.value = "";

            const sendBtn = document.getElementById("sendBtn");
            sendBtn.disabled = true;

            const thinkingMessage = addMessage("Thinking... 🤖", "bot");

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: message
                    })
                });

                if (!response.ok) {
                    throw new Error("Server error: " + response.status);
                }

                const data = await response.json();
                thinkingMessage.remove();

                if (typeof data.reply === "string") {
                    addMessage(data.reply, "bot");
                } else {
                    addMessage(
                        "Sorry, the server returned an unexpected response.",
                        "bot"
                    );
                }

            } catch (error) {
                thinkingMessage.remove();

                addMessage(
                    "Sorry, I couldn't connect to the GPT.KLD server. Please try again.",
                    "bot"
                );

                console.error("Chat error:", error);

            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        }

        function addMessage(text, type) {
            const chatBox = document.getElementById("chatBox");
            const messageDiv = document.createElement("div");

            messageDiv.className = "message " + type;
            messageDiv.textContent = text;

            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            return messageDiv;
        }

        function askExample(question) {
            document.getElementById("question").value = question;
            sendMessage();
        }

        document.getElementById("chatForm").addEventListener(
            "submit",
            function(event) {
                event.preventDefault();
                sendMessage();
            }
        );
    </script>

</body>
</html>
